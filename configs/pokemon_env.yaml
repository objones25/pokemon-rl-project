# Defaults live in EnvConfig; this file records the values this project runs
# with. action_freq, max_steps and n_envs match PWhiddy/PokemonRedExperiments
# v2 and the sequence-model spec's bound interface.
n_envs: 64
action_freq: 24
press_frames: 8
max_steps: 163840
badge_weight: 1.0
heal_weight: 0.5
explore_weight: 0.3
event_weight: 0.1
level_weight: 0.05
# Run 9 (2026-09-04, wandb p1hwysh2, docs/ppo-experiment-history.md) found
# env/stalled_frac reaching 0.94 -- the large majority of envs sitting in a
# menu for thousands of steps at zero cost, since every other component here
# is a non-negative bonus. Originally shipped with a 0-grace trigger (any
# step without a new coordinate) and a claim that 0.002 kept healthy
# exploration net-positive -- wrong, and not just mistuned: explore_weight/
# sqrt(k) decays toward 0 as k grows while a flat per-step penalty does
# not, so a 0-grace trigger makes continued exploration net-negative
# eventually regardless of idle_penalty_weight's magnitude (run 9's own
# numbers already crossed that line at 0.002 -- 15*0.002=0.03 against a
# ~0.0055 discovery reward). Halving to 0.001 on request only slowed this
# down (~2.7x negative instead of ~5.5x), so the actual fix is structural,
# not a magnitude change: RewardAccumulator.step now only applies this once
# steps_since_new_coord passes _OVERWORLD_STALL_GRACE_STEPS (1000, matching
# aux_state.py's own _STUCK_SATURATION), so ordinary walking between two
# known points -- even for hundreds of steps -- costs nothing at all, and
# this weight only ever taxes a genuine, sustained stall (26,000 steps in
# run 9, dwarfing this grace window). Left at 0.001 (not restored to 0.002)
# since it no longer needs to compete with explore_weight at all -- purely
# a deterrent against pathological stalling now, worth re-tuning up if the
# next run shows it is too weak a deterrent.
idle_penalty_weight: 0.001
# Run 10 (2026-09-04, wandb w0sovi4c) found the idle-penalty fix above
# backfired: since battle was exempt from it, 63 of 64 envs converged on
# sitting at the FIGHT menu forever -- the one remaining zero-cost, zero-
# progress state. Extended the same idle penalty into a stalled battle
# (RewardAccumulator._update_battle_progress) and added the incentive that
# was actually missing: nothing previously rewarded fighting, winning, or
# catching at all, only badges/events/levels/healing.
#
# damage_weight mirrors heal_weight exactly (same squared-HP-fraction-delta
# shape, same reversible-cycle risk -- a trainer can heal their own Pokemon
# mid-battle -- so it shares heal's _DAMAGE_CONTRIBUTION_CEILING=0.2 cap).
damage_weight: 0.5
# A wild-battle win is worth half a badge, same raw scale as heal_weight.
# Uncapped: unlike heal/catch, each win is against a genuinely new, never-
# reversible opponent (you cannot re-fight the same fainted Pokemon), so it
# does not reopen the cycle-farming problem those two are capped against.
battle_win_weight: 0.5
# Two catches already hit _CATCH_CONTRIBUTION_CEILING=0.3 (0.15 * 2) -- a
# meaningful early boost that stops competing with real progress. Capped
# for the same reason heal is: releasing a Pokemon via Bill's PC and
# re-catching it would otherwise farm this the same way deposit/withdraw
# farmed heal_weight before run 1's fix.
catch_weight: 0.15
# Normalized like aux_state.py's own money slot (money / MAX_MONEY), so a
# realistic trainer-battle payout (tens to a few hundred dollars) reads as
# a modest, comparable-to-other-components contribution: a $500 win pays
# ~0.025 here. Wild encounters never pay money, hence damage/battle_won
# above as the primary battle incentive and this as a secondary one for
# trainer fights specifically.
money_weight: 50.0
# All four: first guesses, not yet validated by a live run -- re-tune
# against the next run's reward/damage, reward/battle_won, reward/catch,
# reward/money, and (most importantly) env/stalled_frac trajectories.
# Run 11 (2026-09-05, wandb cq14kskq, docs/2026-09-05-battle-reward-hacking-audit.md
# and docs/superpowers/specs/2026-09-05-battle-reward-redesign-design.md) found
# battle_win_weight's flat, uncapped marginal value let the agent grind wild
# battles as a terminal strategy -- ~261 wins/env by update 46 while
# exploration flatlined and reward/money crashed from repeated blackouts.
# battle_won now decays per badge tier (see rewards.py) rather than being
# capped -- this section is the OTHER half of that fix: a continuous,
# proactive penalty for a hurt team, active whether battling or not, meant
# to prevent ever reaching a blackout rather than punishing one after the
# fact. 0.25 -- not the 50% first considered -- is the threshold below
# which it starts ramping up. low_hp_penalty_weight itself is a first
# guess, not yet validated by a live run -- re-tune against the next run's
# reward/low_hp trajectory alongside env/blackout_count_total, the same
# way every other weight in this file has been.
low_hp_penalty_weight: 0.05
low_hp_threshold: 0.25
