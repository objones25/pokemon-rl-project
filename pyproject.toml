[project]
name = "pokemon-rl-project"
version = "0.1.0"
description = "Data collection pipeline for Pokemon Red/Blue contrastive CNN pretraining"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.4.2",
    "datasets>=5.0.1",
    "huggingface-hub>=1.28.0",
    "imagehash>=4.3.2",
    "numpy>=2.5.2",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "safetensors>=0.8.0",
    "torch>=2.13.0",
    "torchdata>=0.11.0",
    "torchvision>=0.28.0",
    "wandb>=0.28.2",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
data-collection = "data_collection.cli:main"
contrastive-pretrain = "contrastive_pretrain.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_collection", "src/observability", "src/contrastive_pretrain", "src/hf_storage", "src/sequence_model", "src/checkpointing"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
strict_config = true
strict_markers = true
strict_xfail = true
strict_parametrization_ids = true
addopts = [
    "-ra",
    "--tb=short",
    "--cov=src",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=93",
    "-m", "not slow",
]
markers = [
    "slow: requires real network/ffmpeg/HF credentials -- e.g. downloading real Hub shards or the real pretrained ImageNet ResNet-50 weights (deselect with -m 'not slow')",
]
filterwarnings = [
    "error",
    # torchdata's StatefulDataLoader calls the deprecated torch.set_vital()
    # internally; nothing in this project's code path can avoid it. Third-party,
    # not ours to fix -- revisit if a torchdata upgrade removes the call.
    "ignore:'set_vital' is deprecated, please do not call:UserWarning:torchdata.stateful_dataloader.stateful_dataloader",
    # torch's own mkldnn optimization pass (imported lazily the first time
    # torch.compile() runs in a process) applies the deprecated
    # @torch.jit.script_method decorator to an internal class at that
    # module's import time. Third-party/torch-internal, not ours to fix --
    # revisit if a torch upgrade removes torch.utils.mkldnn's use of
    # ScriptModule.
    "ignore:`torch.jit.script_method` is deprecated:DeprecationWarning:torch.jit._script",
    # torch's DataLoader.__init__ warns whenever pin_memory=True is requested
    # on a machine whose default device is MPS (Apple Silicon), since MPS
    # doesn't support pinned memory; it's raised with stacklevel=2, so pytest
    # attributes it to StatefulDataLoader's __init__ (its caller here), not
    # to torch.utils.data.dataloader itself. Machine-dependent, torch/
    # torchdata-internal, not ours to fix -- revisit if a torch upgrade adds
    # MPS pinned-memory support.
    "ignore:'pin_memory' argument is set as true but not supported on MPS now:UserWarning:torchdata.stateful_dataloader.stateful_dataloader",
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 93
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
