[project]
name = "pokemon-rl-project"
version = "0.1.0"
description = "Data collection pipeline for Pokemon Red/Blue contrastive CNN pretraining"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.4.2",
    "datasets>=5.0.1",
    "huggingface-hub>=1.28.0",
    "imagehash>=4.3.2",
    "numpy>=2.5.2",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "trackio>=0.36.0",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
data-collection = "data_collection.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_collection", "src/observability"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: requires real network/ffmpeg/HF credentials (deselect with -m 'not slow')",
]
addopts = "-m \"not slow\""

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
