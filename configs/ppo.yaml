# Defaults live in PPOConfig; this file records the values this project runs
# with. gamma matches PWhiddy/PokemonRedExperiments v2; gae_lambda,
# clip_range, vf_coef and max_grad_norm are stable-baselines3 PPO defaults.
#
# checkpoint_every_updates and hub_snapshot_every_updates are provisional:
# pre-flight gate 2 measures iteration time and replaces them. The binding
# requirement is at most 20 minutes of work lost.
n_steps: 1024
n_epochs: 3
minibatch_envs: 8
gamma: 0.997
gae_lambda: 0.95
clip_range: 0.2
# 0.01 (PWhiddy v2's value) let entropy fall from ln(7)=1.95 to ~1.0-1.2 by
# update ~130 in two consecutive live runs (2026-09-01, wandb runs i3eojhl2
# and 2oubkma4), well before any badge -- both runs then aborted on
# approx_kl within a handful of updates of each other despite very
# different reward compositions (one with an unfixed heal-farming exploit,
# one without), which points at the entropy collapse itself, not reward
# shape, as the shared driver. Doubled here as the first of two variables
# tried one at a time. Result (run 3, wandb 3h04igwb): held entropy
# noticeably higher (~1.25-1.35 vs ~1.0-1.2 at the equivalent point) and
# survived to update 190 instead of ~135 -- a real, measurable improvement,
# but the same approx_kl abort recurred anyway. LR decay (below) is the
# second variable, held constant here rather than raised further so its
# own effect stays isolated. Re-tune against whatever the next run's own
# entropy curve shows, per this project's convention that these weights
# need empirical tuning, not a fixed prior.
#
# Run 7 (2026-09-03, wandb r16u9ekw), still at 0.02: target_kl + the
# stall-based abort (1aba5d9) both worked exactly as designed -- the run
# didn't crash on a rejected minibatch's raw approx_kl, it correctly
# detected 10 consecutive updates stuck at minibatches_completed==1 and
# aborted with the checkpoint intact at update 247. loss/entropy still
# fell the whole run (1.95 -> ~1.26-1.6 in the final 60 updates, same
# range as runs 3-6 at this ent_coef), and the newly-added percentile
# ratio diagnostics (ratio/abs_dev_p50 vs ratio/max_abs_dev_update) show
# WHY minibatches keep getting rejected: p50 sits at ~1e-6-1e-2 (the
# batch's 8192 (env, step) positions barely move) while max_abs_dev spikes
# into the hundreds-to-thousands (e.g. update 240: max_abs_dev=9460.4,
# approx_kl_mean=1.1505 -- (ratio-1-log(ratio)) for that ONE outlier
# position alone is ~1.1538, i.e. it accounts for ~99.7% of that
# minibatch's entire approx_kl). This is a single near-zero-probability
# action's ratio exploding (log'(p)=1/p as p->0, per
# rl-agent-expert/references/stability.md's entropy-collapse section),
# not broad policy drift -- consistent with advantage/raw_std sitting at
# ~0.002-0.04 (noise-floor scale) for nearly the entire run once the
# critic fits well (value/explained_variance 0.7-0.95), so
# `(advantage - mean) / (std + 1e-8)` has very little real signal left to
# normalize and amplifies whatever noise remains. attn/logit_max (4.9-7.8)
# and model/residual_norm (22.6-21.8) stayed healthy throughout, ruling
# out an activation blowup as an alternative explanation.
#
# ent_coef doubled again (0.02 -> 0.04) as the next single-variable test,
# per rl-agent-expert's ranked fix list for this exact symptom (entropy
# already near zero when a large-KL step happens): raising ent_coef is
# next in that list after target_kl-early-stopping/LR-decay/grad-clipping,
# all of which are already in place here. This is not expected to stop
# entropy from ever falling -- per that same reference, the point is
# "not to fix the collapse directly, but to keep the policy recoverable"
# for longer, i.e. keep enough mass on the tail actions that a normal
# gradient step can't send one of them into the log'(p)=1/p regime.
ent_coef: 0.04
vf_coef: 0.5
max_grad_norm: 0.5
lr: 0.0003
warmup_steps: 100
# Optimizer-step units, same as warmup_steps, starting the moment warmup
# ends: cosine decay from lr to lr*lr_floor_ratio, then held at the floor
# forever (never reaches exactly 0 -- a live run has no fixed length,
# max_updates=None by default, and freezing lr at 0 past the horizon would
# silently stop all learning with no error). n_epochs=3 * (n_envs=64 /
# minibatch_envs=8) = 24 optimizer steps per update, so 6000 steps is ~250
# updates. Result (run 4, wandb 3o1fui88): train/lr decayed exactly as
# designed (confirmed on the dashboard), but the run aborted at update 135
# -- WORSE than run 3's 190 with no decay at all, despite identical
# ent_coef. Not read as decay being harmful: every run so far used the
# same seed=0, but with 64 real subprocess emulators and wall-clock IPC
# ordering that does not make runs reproducible, and updates-to-divergence
# had already ranged 135-190 across runs differing by one other change --
# one more single-seed sample in that range isn't evidence either way.
# Left in place rather than reverted; target_kl below is a mechanism-level
# fix that should matter regardless of how this question eventually
# resolves.
lr_decay_steps: 6000
lr_floor_ratio: 0.1
# Per-minibatch early stopping (SB3's target_kl convention exactly: the
# actual cutoff is 1.5x this value). Every run before this (i3eojhl2,
# 2oubkma4, 3h04igwb, 3o1fui88; 2026-09-01/02) let a whole update's 3
# epochs run to completion even as ratio/max_abs_dev spiked into the
# hundreds mid-update -- this stops taking further minibatches THIS
# UPDATE the moment one minibatch's own approx_kl crosses 0.03, rather
# than only aborting the entire run after the damage compounds across a
# full update. 0.02 matches the range where every run's ratio/approx_kl
# was still climbing but hadn't yet spiked in its healthy early phase
# (~0.01-0.05 range, e.g. run 4 updates 0-90).
#
# Result (run 5, wandb 02auc1ar): worked as designed -- survived to update
# 225 (past run 3's 190), with target_kl_triggered firing on 30
# consecutive updates near the end while training kept going, rejecting
# ever-more minibatches per update as entropy fell (loss/entropy dipped to
# 0.58 by the end; attn/logit_max and model/residual_norm both stayed flat
# the whole run, ruling out an activation blowup as the mechanism). The
# run still eventually died on abort_approx_kl -- but that check was
# reading the REJECTED minibatch's own approx_kl (never applied, by
# definition of target_kl having just rejected it), which overstates
# actual drift once target_kl exists. Fixed alongside this: see
# max_consecutive_stalled_updates below.
target_kl: 0.02
# Only consulted when target_kl is set. abort_approx_kl (still 0.5,
# unchanged) is skipped entirely in that mode -- every APPLIED minibatch,
# by construction, already satisfied approx_kl <= 1.5*target_kl at the
# moment it applied, so comparing the last-COMPUTED (possibly rejected)
# minibatch's approx_kl against 0.5 was alarming on a mechanism that had
# already done its job (see run 5's postmortem above). This instead
# aborts once minibatches_completed has sat at its invariant-guaranteed
# floor of 1 for this many updates in a row -- sustained inability to
# progress, not one rejected probe's magnitude. 10 is PPOConfig's own
# default; named explicitly here since it's a new safety-relevant knob,
# not yet validated against a real run.
max_consecutive_stalled_updates: 10
seed: 0
# The resolved commit of objones25/pokemon-contrastive-encoder, not `main`:
# a branch head resolves at download time, so a push to that repo would change
# the features underneath a running agent, and the checkpoint manifest would
# record only the branch name -- leaving a resume unable to detect the drift.
# Re-resolve with HfApi().repo_info(repo_id, repo_type="model").sha after any
# deliberate encoder re-export.
#
# Re-published 2026-08-28: the prior commit's latent_stats.json (computed
# over just the first 2000 frames of 2 validation videos, in stream order)
# reported 9 of 2048 latent dims as exactly zero-variance, which
# load_latent_stats refuses to divide by. Recomputing over 36,040 frames
# spread evenly across all 7 source videos' full timelines showed 7 of those
# 9 are real, extremely rare feature detectors (firing on 0.003%-0.5% of
# frames) that the narrow original sample never triggered -- not dead units,
# and no CNN retrain was needed. Only dims 1773 and 1994 remained exactly
# (mean=0, std=0) across the full broad sample; those two were floored to
# std=1.0, which is exact for a genuinely constant channel. Same model
# weights as the prior commit -- only latent_stats.json changed.
frozen_encoder_revision: 9db5cb99991fd976501fca533e976ecad815b321
checkpoint_dir: /workspace/checkpoints
keep_last_n: 3
checkpoint_every_updates: 25
artifact_every_updates: 25
hub_snapshot_every_updates: 75
